plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def repoRoot = rootProject.projectDir.parentFile
def seedManifest = new groovy.json.JsonSlurper().parse(new File(repoRoot, 'seed/manifest.json'))
def seedDigest = seedManifest.artifacts['domains_core.txt'].sha256
def termsDigest = seedManifest.artifacts['terms.json'].sha256
if (!(seedDigest ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid domain seed digest')
if (!(termsDigest ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid terms seed digest')
def seedBuilt = seedManifest.built_at.toString().take(10)
if (!(seedBuilt ==~ /\d{4}-\d{2}-\d{2}/)) throw new GradleException('Invalid seed build date')
// The bundled visual engine/model revision is part of what an image-check receipt identifies.
def visualRevision = new groovy.json.JsonSlurper()
        .parse(new File(repoRoot, 'extension/visual/assets.json')).revision
if (!(visualRevision ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid visual asset revision')
def verifySeed = tasks.register('verifyAndroidSeed', Exec) {
    workingDir repoRoot
    commandLine 'python3', 'blocklist/seed.py', 'verify'
}
def copySeed = tasks.register('copyVerifiedAndroidSeed', Sync) {
    dependsOn verifySeed
    from(new File(repoRoot, 'seed')) { include 'domains_core.txt', 'terms.json' }
    into layout.buildDirectory.dir('generated/verifiedSeed')
}

// Reuse the reviewed, bundled local classifier and preserve its third-party notices.
def copyVisual = tasks.register('copyAndroidVisual', Sync) {
    doFirst {
        def visualRoot = new File(repoRoot, 'extension/visual')
        def inventory = new groovy.json.JsonSlurper().parse(new File(visualRoot, 'assets.json'))
        ['engine.bundle.js', 'engine.bundle.js.LEGAL.txt',
         'wasm/tfjs-backend-wasm.wasm', 'wasm/tfjs-backend-wasm-simd.wasm',
         'wasm/tfjs-backend-wasm-threaded-simd.wasm',
         'models/blazeface.json', 'models/blazeface.bin',
         'models/gender.json', 'models/gender.bin'].each { name ->
            def artifact = new File(visualRoot, name)
            def entry = inventory.artifacts[name]
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            if (entry == null || artifact.length() != entry.bytes || actual != entry.sha256)
                throw new GradleException('Visual artifact integrity check failed: ' + name)
        }
    }
    from(new File(repoRoot, 'extension/visual')) {
        include 'engine.bundle.js', 'engine.bundle.js.LEGAL.txt', 'assets.json', 'notices/**',
                'wasm/*.wasm', 'models/*.json', 'models/*.bin'
        // The app runs FaceRes natively (assets/faceres_gender.tflite). The WebView copy is only
        // for accuracy runs that compare engines: -PhisnVisualFaceresWebView=true.
        if (providers.gradleProperty('hisnVisualFaceresWebView').orNull != 'true') exclude 'models/faceres.*'
    }
    into layout.buildDirectory.dir('generated/visualAssets/visual')
}

// Each edition's name, in English and Arabic copy. src/main's strings say "Hisn" / "حصن" (and
// "حِصن"); for any other edition the build writes overrides of only the strings that name the
// app, so the copy is kept in one place. "Unrot" / "أنروت" are working names.
def editions = [
        hisn   : [en: 'Hisn', ar: 'حصن'],
        general: [en: 'Unrot', ar: 'أنروت'],
]
def editionStrings = tasks.register('generateEditionStrings') {
    def resRoot = file('src/main/res')
    def strings = fileTree(resRoot) { include 'values*/strings.xml' }
    def outRoot = layout.buildDirectory.dir('generated/editionStrings').get().asFile
    inputs.files strings
    inputs.property 'editions', editions.toString()
    outputs.dir outRoot
    doLast {
        project.delete outRoot
        editions.findAll { it.key != 'hisn' }.each { edition, names ->
            strings.files.each { source ->
                def overrides = (source.getText('UTF-8') =~ /(?s)<(string|plurals)\b[^>]*>.*?<\/\1>/)
                        .collect { it[0] }
                        .findAll { it =~ /(\\[nt]|\b)Hisn\b|حصن|حِصن/ }
                        .collect { it.replaceAll(/(\\[nt]|\b)Hisn\b/, '$1' + names.en).replace('حِصن', names.ar).replace('حصن', names.ar) }
                if (overrides.isEmpty()) return
                def target = new File(outRoot, edition + '/' + source.parentFile.name + '/strings.xml')
                target.parentFile.mkdirs()
                target.setText('<?xml version="1.0" encoding="utf-8"?>\n' +
                        '<!-- Generated by generateEditionStrings from src/main/res; do not edit. -->\n' +
                        '<resources>\n    ' + overrides.join('\n    ') + '\n</resources>\n', 'UTF-8')
            }
        }
    }
}

// Production signing is supplied only by the owner's environment; no key material lives in the repo.
def releaseSigning = ['HISN_ANDROID_KEYSTORE', 'HISN_ANDROID_KEYSTORE_PASSWORD', 'HISN_ANDROID_KEY_ALIAS', 'HISN_ANDROID_KEY_PASSWORD']
        .collectEntries { [(it): providers.environmentVariable(it).orNull] }
def releaseSigningCount = releaseSigning.values().count { it }
if (releaseSigningCount != 0 && releaseSigningCount != releaseSigning.size())
    throw new GradleException('Set all or none of: ' + releaseSigning.keySet().join(', '))

android {
    namespace 'app.hisn.android'
    compileSdk 37

    defaultConfig {
        applicationId 'app.hisn.android'
        manifestPlaceholders = [hisnAppLabel: '@string/app_name']
        minSdk 23
        targetSdk 36
        versionCode 44
        versionName '1.0.0-beta1'
        // -PhisnUiTests=true runs the Compose shell tests (androidTest/.../nativeshell) instead
        // of the engine checks; both live in the same test APK.
        testInstrumentationRunner providers.gradleProperty('hisnUiTests').orNull == 'true'
                ? 'androidx.test.runner.AndroidJUnitRunner'
                : 'app.hisn.android.CoreDeviceTestRunner'
        buildConfigField 'String', 'DOMAIN_SEED_SHA256', '"' + seedDigest + '"'
        buildConfigField 'int', 'DOMAIN_SEED_COUNT', seedManifest.core_domain_count.toString()
        buildConfigField 'int', 'DOMAIN_SEED_VERSION', seedManifest.version.toString()
        buildConfigField 'String', 'DOMAIN_SEED_BUILT', '"' + seedBuilt + '"'
        buildConfigField 'String', 'TERMS_SEED_SHA256', '"' + termsDigest + '"'
        buildConfigField 'String', 'VISUAL_ASSET_REVISION', '"' + visualRevision + '"'
        // Direct (sideload) builds may leave Hisn's uninstall and disable screens. Google Play's
        // Accessibility API policy forbids that for personal self-control, so Play builds never do.
        def direct = providers.gradleProperty('hisnDistribution').orNull == 'direct'
        buildConfigField 'boolean', 'SELF_PROTECTION', direct.toString()
        // "Show all apps" needs QUERY_ALL_PACKAGES to list apps with no launcher icon. Google Play
        // restricts that permission, so only the direct build declares it; the Play build repeats
        // a permission it already has, which adds nothing.
        manifestPlaceholders.hisnAllApps = direct ? 'android.permission.QUERY_ALL_PACKAGES'
                : 'android.permission.ACCESS_NETWORK_STATE'
        if (direct) versionNameSuffix '-direct'
    }

    // Two editions from one engine. Everything that blocks lives in src/main and stays
    // edition-neutral; each edition's name, look and content live in src/<edition>/ and are read
    // in code through app.hisn.android.Edition.
    //  - hisn: the Islamic edition and its Islamic UI. Keeps the published package.
    //  - general: the non-religious brainrot blocker with the normal UI. Its package is a
    //    placeholder until the name is chosen; Play never lets a package change after upload.
    flavorDimensions = ['edition']
    productFlavors {
        editions.each { edition, names ->
            create(edition) {
                dimension 'edition'
                if (edition != 'hisn') applicationIdSuffix '.' + edition
                buildConfigField 'String', 'EDITION', '"' + edition + '"'
                buildConfigField 'String', 'APP_NAME', '"' + names.en + '"'
                buildConfigField 'String', 'APP_NAME_AR', '"' + names.ar + '"'
            }
        }
    }

    editions.keySet().findAll { it != 'hisn' }.each { edition ->
        sourceSets.getByName(edition).res.srcDir layout.buildDirectory.dir('generated/editionStrings/' + edition).get().asFile
    }

    sourceSets.main.java.srcDir '../core/src/main/java'
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/verifiedSeed').get().asFile
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/visualAssets').get().asFile
    buildFeatures {
        buildConfig true
        compose true
    }
    signingConfigs {
        if (releaseSigningCount != 0) release {
            storeFile file(releaseSigning.HISN_ANDROID_KEYSTORE)
            storePassword releaseSigning.HISN_ANDROID_KEYSTORE_PASSWORD
            keyAlias releaseSigning.HISN_ANDROID_KEY_ALIAS
            keyPassword releaseSigning.HISN_ANDROID_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            // Without the owner's key, assembleRelease still produces an unsigned APK for inspection.
            if (releaseSigningCount != 0) signingConfig signingConfigs.release
            // R8 drops the unused Compose icons and libraries (the APK was about 44 MB without it).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Run fixed visual fixtures alongside the owner's app without restarting its services.
            if (providers.gradleProperty('hisnIsolatedVisualCheck').orNull == 'true') {
                applicationIdSuffix '.visualcheck'
                manifestPlaceholders.hisnAppLabel = 'Hisn Visual Test'
            }
        }
    }
    androidResources {
        // TfliteClassifier maps the model from the APK; a compressed asset cannot be mapped.
        noCompress 'tflite'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // java.time and other Java 8+ library APIs on devices below API 26.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // Native adult inference; the WebView engine remains the fallback and the people path.
    // LiteRT is TensorFlow Lite's successor with the same org.tensorflow.lite API. 1.4.x
    // ships 16 KB-aligned arm64 libraries (TensorFlow Lite 2.16.1's were 4 KB, which a
    // 16 KB-page phone cannot load) and still supports minSdk 23; LiteRT 2.x needs 24.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'

    // The native shell is the app's front door from 1.6.0 on.
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    // Shape morphing for the pause screen's breathing shape. Material 3 1.5 builds its Expressive
    // shapes on this, but 1.5 needs minSdk 24; this library alone runs from API 21.
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Unrot Plus (general edition only): the Islamic edition ships without billing.
    generalImplementation 'com.android.billingclient:billing:7.1.1'

    // UI and UX tests for the shell. Test-only; nothing here reaches a release build.
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

tasks.named('preBuild').configure { dependsOn copySeed, copyVisual, editionStrings }
