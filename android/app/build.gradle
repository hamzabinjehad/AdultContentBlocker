plugins { id 'com.android.application' }

def repoRoot = rootProject.projectDir.parentFile
def seedManifest = new groovy.json.JsonSlurper().parse(new File(repoRoot, 'seed/manifest.json'))
def seedDigest = seedManifest.artifacts['domains_core.txt'].sha256
def termsDigest = seedManifest.artifacts['terms.json'].sha256
if (!(seedDigest ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid domain seed digest')
if (!(termsDigest ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid terms seed digest')
def seedBuilt = seedManifest.built_at.toString().take(10)
if (!(seedBuilt ==~ /\d{4}-\d{2}-\d{2}/)) throw new GradleException('Invalid seed build date')
// The bundled visual engine/model revision is part of what an image-check receipt identifies.
def visualRevision = new groovy.json.JsonSlurper()
        .parse(new File(repoRoot, 'extension/visual/assets.json')).revision
if (!(visualRevision ==~ /[0-9a-f]{40}/)) throw new GradleException('Invalid visual asset revision')
def verifySeed = tasks.register('verifyAndroidSeed', Exec) {
    workingDir repoRoot
    commandLine 'python3', 'blocklist/seed.py', 'verify'
}
def copySeed = tasks.register('copyVerifiedAndroidSeed', Sync) {
    dependsOn verifySeed
    from(new File(repoRoot, 'seed')) { include 'domains_core.txt', 'terms.json' }
    into layout.buildDirectory.dir('generated/verifiedSeed')
}

// Reuse the reviewed, bundled local classifier and preserve its third-party notices.
def copyVisual = tasks.register('copyAndroidVisual', Sync) {
    doFirst {
        def visualRoot = new File(repoRoot, 'extension/visual')
        def inventory = new groovy.json.JsonSlurper().parse(new File(visualRoot, 'assets.json'))
        ['engine.bundle.js', 'engine.bundle.js.LEGAL.txt',
         'wasm/tfjs-backend-wasm.wasm', 'wasm/tfjs-backend-wasm-simd.wasm',
         'wasm/tfjs-backend-wasm-threaded-simd.wasm',
         'models/blazeface.json', 'models/blazeface.bin',
         'models/gender.json', 'models/gender.bin'].each { name ->
            def artifact = new File(visualRoot, name)
            def entry = inventory.artifacts[name]
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            if (entry == null || artifact.length() != entry.bytes || actual != entry.sha256)
                throw new GradleException('Visual artifact integrity check failed: ' + name)
        }
    }
    from(new File(repoRoot, 'extension/visual')) {
        include 'engine.bundle.js', 'engine.bundle.js.LEGAL.txt', 'assets.json', 'notices/**',
                'wasm/*.wasm', 'models/*.json', 'models/*.bin'
    }
    into layout.buildDirectory.dir('generated/visualAssets/visual')
}

// Production signing is supplied only by the owner's environment; no key material lives in the repo.
def releaseSigning = ['HISN_ANDROID_KEYSTORE', 'HISN_ANDROID_KEYSTORE_PASSWORD', 'HISN_ANDROID_KEY_ALIAS', 'HISN_ANDROID_KEY_PASSWORD']
        .collectEntries { [(it): providers.environmentVariable(it).orNull] }
def releaseSigningCount = releaseSigning.values().count { it }
if (releaseSigningCount != 0 && releaseSigningCount != releaseSigning.size())
    throw new GradleException('Set all or none of: ' + releaseSigning.keySet().join(', '))

android {
    namespace 'app.hisn.android'
    compileSdk 37

    defaultConfig {
        applicationId 'app.hisn.android'
        // The native shell entry point is declared in the debug manifest but stays disabled unless
        // -PhisnNativeShell=true, so a plain debug build keeps exactly the existing launcher.
        manifestPlaceholders = [hisnAppLabel: '@string/app_name', classicLabel: '@string/app_name', nativeShellEnabled: 'false']
        minSdk 23
        targetSdk 36
        versionCode 43
        versionName '1.6.0'
        testInstrumentationRunner 'app.hisn.android.CoreDeviceTestRunner'
        buildConfigField 'String', 'DOMAIN_SEED_SHA256', '"' + seedDigest + '"'
        buildConfigField 'int', 'DOMAIN_SEED_COUNT', seedManifest.core_domain_count.toString()
        buildConfigField 'int', 'DOMAIN_SEED_VERSION', seedManifest.version.toString()
        buildConfigField 'String', 'DOMAIN_SEED_BUILT', '"' + seedBuilt + '"'
        buildConfigField 'String', 'TERMS_SEED_SHA256', '"' + termsDigest + '"'
        buildConfigField 'String', 'VISUAL_ASSET_REVISION', '"' + visualRevision + '"'
        // Direct (sideload) builds may leave Hisn's uninstall and disable screens. Google Play's
        // Accessibility API policy forbids that for personal self-control, so Play builds never do.
        def direct = providers.gradleProperty('hisnDistribution').orNull == 'direct'
        buildConfigField 'boolean', 'SELF_PROTECTION', direct.toString()
        if (direct) versionNameSuffix '-direct'
    }

    sourceSets.main.java.srcDir '../core/src/main/java'
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/verifiedSeed').get().asFile
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/visualAssets').get().asFile
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigningCount != 0) release {
            storeFile file(releaseSigning.HISN_ANDROID_KEYSTORE)
            storePassword releaseSigning.HISN_ANDROID_KEYSTORE_PASSWORD
            keyAlias releaseSigning.HISN_ANDROID_KEY_ALIAS
            keyPassword releaseSigning.HISN_ANDROID_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            // Without the owner's key, assembleRelease still produces an unsigned APK for inspection.
            if (releaseSigningCount != 0) signingConfig signingConfigs.release
        }
        debug {
            // Run fixed visual fixtures alongside the owner's app without restarting its services.
            if (providers.gradleProperty('hisnIsolatedVisualCheck').orNull == 'true') {
                applicationIdSuffix '.visualcheck'
                manifestPlaceholders.hisnAppLabel = 'Hisn Visual Test'
                manifestPlaceholders.classicLabel = 'Hisn Visual Test'
            }
            // Phase 2 of the native UI port: a Compose shell in the same package, so it can read
            // the real PolicyStore and service state. Both launchers are present until the native
            // editors reach parity; the classic app keeps its label and remains the default.
            // This debug build replaces the installed app of the same signature, so it is for the
            // emulator/test device, not the owner's release install.
            if (providers.gradleProperty('hisnNativeShell').orNull == 'true') {
                // The application label stays Hisn (the VPN consent dialog reads it); only the
                // classic launcher gets the disambiguating label next to Hisn Native.
                manifestPlaceholders.classicLabel = 'Hisn (classic)'
                manifestPlaceholders.nativeShellEnabled = 'true'
            }
        }
    }
    androidResources {
        // TfliteClassifier maps the model from the APK; a compressed asset cannot be mapped.
        noCompress 'tflite'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // java.time and other Java 8+ library APIs on devices below API 26.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // Native adult inference; the WebView engine remains the fallback and the people path.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    // Native shell: debug variant only. The module carries Compose, Kotlin and the shell
    // screens, so no release variant links them and the release APK gains no classes or size.
    debugImplementation project(':nativeshell')
}

tasks.named('preBuild').configure { dependsOn copySeed, copyVisual }
