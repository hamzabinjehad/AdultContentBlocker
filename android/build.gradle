plugins {
    id 'com.android.application' version '9.1.1' apply false
    // AGP 9 compiles Kotlin itself; this plugin only adds the Compose compiler. It is applied by
    // the debug-only :nativeshell module, so release builds still contain no Compose code.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
}
