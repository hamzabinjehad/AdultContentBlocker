plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Phase 1 of the native UI port. This module exists so the Compose shell, its dependencies and
// the Kotlin runtime never enter a release build of :app: only the debug variant depends on it.
// It holds presentation code alone — no policy, no service and no network access.
android {
    namespace 'app.hisn.android.nativeshell'
    compileSdk 37

    defaultConfig {
        minSdk 23
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'
}
