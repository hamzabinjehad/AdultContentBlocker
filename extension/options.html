<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hisn Settings</title>
<style>
:root{--bg:#f7f7f5;--fg:#1a1a18;--muted:#6b6b66;--line:#e3e3df;--accent:#2f6f4f}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#f0efec;--muted:#9a9a94;--line:#33322e;--accent:#7fb79a}}
*{box-sizing:border-box}
body{margin:0;padding:40px 24px;background:var(--bg);color:var(--fg);
     font:15px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
main{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 28px;font-size:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 18px}
legend{padding:0 8px;font-size:13px;font-weight:600;color:var(--muted)}
textarea{width:100%;min-height:130px;padding:10px;border:1px solid var(--line);
         border-radius:8px;background:var(--bg);color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
button{margin-top:12px;padding:9px 18px;border:none;border-radius:8px;
       background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{margin-top:12px;font-size:13px;color:var(--muted);min-height:1.4em}
</style></head>
<body><main>
<h1>Hisn Settings</h1>
<p class="sub">Additions take effect immediately. Removals are blocked while a lock is running.</p>

<fieldset><legend>Sites you always want blocked</legend>
<textarea id="custom" placeholder="one domain per line&#10;example.com"></textarea>
<button id="saveCustom">Save block list</button>
<div class="msg" id="msgCustom"></div>
</fieldset>

<fieldset><legend>Strict mode allowlist</legend>
<textarea id="allow" placeholder="one domain per line&#10;github.com"></textarea>
<button id="saveAllow">Save allowlist</button>
<div class="msg" id="msgAllow"></div>
</fieldset>
</main><script src="options.js"></script></body></html>
