<!doctype html><meta charset="utf-8"><title>Hisn settings tests</title>
<style>body{font:14px system-ui}iframe{width:740px;height:650px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<h1>Settings: browser-only and app-connected</h1>
<pre id="summary" data-result="pending">Running…</pre>
<div id="frames"></div>
<script type="module">
import { HEARTBEAT_GRACE_MS } from "../../lib/policy.js";
const results = [];
function check(ok, label) { results.push(`${ok ? "ok" : "FAIL"} ${label}`); if (!ok) throw new Error(label); }
const pause = () => new Promise((resolve) => setTimeout(resolve, 100));
try {
  const source = await (await fetch("../../options.html")).text();
  async function frame(managed, uiLanguage) {
    const f = document.createElement("iframe");
    const fixture = {
      appPresent: managed, mode: "blocklist", lockUntil: 0, lastHeartbeat: Date.now(),
      failClosed: false, customBlocks: ["example.com"], allowlist: [], customTerms: [],
      textAllow: [], ignoreTerms: [], disputed: [], inspectText: true, textSensitivity: 50,
      desiredRevision:1,appliedRevision:1,enforcement:{version:1,status:"applied",desiredRevision:1,appliedRevision:1,
        layers:{domains:"applied",search:"applied",text:"applied",visual:"off"},downloadedRules:{domains:0,keywords:0,listVersion:0}},
    };
    const mock = `<script>
      window.fixture = ${JSON.stringify(fixture)};
      window.writes = 0;
      window.reads = 0;
      window.writeDelay = 0;
      window.rejectWrite = false;
      window.workerUnavailable = false;
      window.syncCalls = 0;
      window.repairCalls = 0;
      window.repairDelay = 0;
      window.repairReply = {ok:true};
      window.changeHandlers = [];
      window.chrome = { storage: { onChanged: { addListener(fn) { changeHandlers.push(fn); } },
          local: { get: async () => (${JSON.stringify(uiLanguage ?? null)} ? { uiLanguage: ${JSON.stringify(uiLanguage ?? null)} } : {}),
                   set: async () => {} } },
        runtime: { sendMessage(msg, cb) {
          if (workerUnavailable) return cb({ok:false,reason:'unavailable'});
          if (msg.type === 'getState') { reads++; return cb(structuredClone(fixture)); }
          if (msg.type === 'getVisualStatus') return cb({state:'disabled',available:true,supportedPersonModes:['off','all','female','male']});
          if (msg.type === 'forceSync') { syncCalls++; return cb({ok:false}); }
          if (msg.type === 'repairProtection') {
            repairCalls++;
            return setTimeout(() => cb(repairReply), repairDelay);
          }
          if (msg.type === 'update') {
            writes++;
            return setTimeout(() => {
              if (rejectWrite) return cb({ok:false,reason:'unavailable'});
              Object.assign(fixture, msg.patch);
              cb({ok:true,state:structuredClone(fixture)});
            }, writeDelay);
          }
        } }
      };
    <\/script>`;
    f.srcdoc = source.replace('<head>', `<head><base href="${new URL('../../options.html', location.href).href}">${mock}`);
    document.getElementById("frames").append(f);
    await new Promise((resolve) => f.onload = resolve);
    // Real-timer CI must wait for the module's first worker request rather
    // than assuming a cold browser can initialize every import in 100ms.
    for (let attempt = 0; attempt < 50 && !f.contentWindow.reads; attempt++) await pause();
    if (!f.contentWindow.reads) throw new Error("settings module did not initialize within 5 seconds");
    await pause();
    return f;
  }
  const solo = await frame(false);
  const s = solo.contentDocument, w = solo.contentWindow;
  check(s.getElementById("modeTitle").textContent === "Browser-only protection", "standalone identity");
  check(!s.getElementById("custom").disabled, "standalone fields editable");
  check(!s.getElementById("overview").hidden && s.getElementById("rules").hidden, "overview is the first screen");
  check(s.getElementById("repairProtection").getBoundingClientRect().height >= 44,
    "overview repair has a comfortable touch target");
  s.querySelector('a[href="#rules"]').click(); await pause();
  check(!s.getElementById("rules").hidden && s.getElementById("overview").hidden, "navigation opens Blocking Rules");
  check(s.querySelector('a[href="#rules"]').getAttribute("aria-current") === "page", "navigation exposes the selected view");
  s.getElementById("custom").value = "draft.example";
  s.getElementById("custom").dispatchEvent(new Event("input"));
  check(s.getElementById("siteSettings").querySelector(".draft-note").textContent === "Unsaved changes", "draft clearly distinguished from applied settings");
  s.getElementById("siteSettings").querySelector(".secondary").click();
  check(s.getElementById("custom").value === "example.com" && w.writes === 0, "discard restores saved value without writing policy");
  s.getElementById("custom").value = "good.example\nbad domain";
  s.getElementById("saveCustom").click(); await pause();
  check(w.writes === 0 && s.getElementById("msgCustom").textContent.includes("2"), "invalid input is identified and never saved");
  s.getElementById("custom").value = "https://www.good.example/path\ngood.example";
  s.getElementById("saveCustom").click(); await pause();
  check(w.fixture.customBlocks.join() === "good.example", "normalized domain reaches worker");
  check(s.getElementById("custom").value === "good.example", "editor shows saved canonical value");
  check(s.getElementById("siteSettings").querySelector(".draft-note").textContent === "", "saved edit clears draft indicator");
  check(!s.getElementById("inspectVisual").disabled && !s.querySelector('[name="personChoice"][value="female"]').disabled,
    "ordinary rules save restores visual controls even when visual polling is off");
  s.getElementById("allow").value = "unsaved.example";
  s.getElementById("customTerms").value = "gambling";
  s.getElementById("saveTerms").click(); await pause();
  check(s.getElementById("allow").value === "unsaved.example", "saving another section preserves drafts");
  s.querySelector('a[href="#settings"]').click(); await pause();
  s.querySelector('a[href="#rules"]').click(); await pause();
  check(s.getElementById("allow").value === "unsaved.example", "navigation preserves unsaved drafts");
  const repair = s.getElementById("repairProtection"), repairMessage = s.getElementById("repairMessage");
  const syncBeforeRepair = w.syncCalls, writesBeforeRepair = w.writes;
  repair.click(); await pause();
  check(repairMessage.textContent.includes("configuration verified") && s.getElementById("allow").value === "unsaved.example",
    "successful browser repair preserves unsaved site drafts");
  check(w.repairCalls === 1 && w.syncCalls === syncBeforeRepair && w.writes === writesBeforeRepair,
    "browser repair neither syncs the native app nor saves policy drafts");
  w.repairDelay = 300;
  const repairsBeforeDoubleClick = w.repairCalls;
  repair.click();
  check(repair.disabled && repair.getAttribute("aria-busy") === "true", "settings repair exposes its pending state");
  repair.dispatchEvent(new MouseEvent("click", {bubbles:true}));
  check(w.repairCalls === repairsBeforeDoubleClick + 1, "settings repair cannot queue duplicate requests");
  await new Promise(resolve => setTimeout(resolve, 400));
  check(!repair.disabled && !repair.hasAttribute("aria-busy"), "settings repair restores its action after completion");
  w.repairDelay = 0;
  w.repairReply = {ok:false,reason:"unavailable"};
  repair.click(); await pause();
  check(repairMessage.textContent.includes("did not confirm") && !repairMessage.textContent.includes("configuration verified"),
    "settings repair cannot claim success from an old receipt after missing acknowledgement");
  w.workerUnavailable = true;
  repair.click(); await pause();
  check(repairMessage.textContent.includes("did not confirm") && s.getElementById("allow").value === "unsaved.example",
    "repair worker outage leaves the unsaved draft intact");
  w.workerUnavailable = false;
  w.repairReply = {ok:true};
  repair.click(); await pause();
  check(repairMessage.textContent.includes("configuration verified") && s.getElementById("allow").value === "unsaved.example",
    "repair recovery still recognizes and preserves a draft created before the outage");
  check(w.syncCalls === syncBeforeRepair && w.writes === writesBeforeRepair,
    "repair retries and outage recovery never poll native or commit browser drafts");
  w.workerUnavailable = true;
  s.getElementById("checkConnection").click(); await pause();
  check(s.getElementById("connectionMessage").textContent.includes("could not be verified"), "worker outage is distinct from a missing app");
  check(s.getElementById("allow").value === "unsaved.example", "unavailable reconnect preserves drafts");
  w.workerUnavailable = false;
  s.getElementById("checkConnection").click(); await pause();
  check(s.getElementById("connectionMessage").textContent.includes("No connection") && s.getElementById("allow").value === "unsaved.example", "retry recovers worker access without losing drafts");
  check(w.fixture.customTerms[0] === "gambling", "custom terms saved");
  w.fixture.textSensitivity = 75;
  for (const fn of w.changeHandlers) fn({state:{newValue:w.fixture}}, "local");
  check(s.getElementById("textSensitivity").value === "75", "untouched controls follow changes from another settings window");
  check(s.getElementById("allow").value === "unsaved.example", "external changes preserve edited controls");
  s.getElementById("discardAll").click();
  check(s.getElementById("saveBar").hidden && s.getElementById("allow").value === "", "global discard restores all saved fields");
  const entry = s.getElementById("customEntry");
  entry.value = "https://www.docs.example/path";
  entry.closest("form").dispatchEvent(new Event("submit", {cancelable:true}));
  check(s.getElementById("custom").value.includes("docs.example") && !s.getElementById("saveBar").hidden, "quick add canonicalizes a web address into a draft");
  check(s.querySelector('a[href="#rules"]').classList.contains("has-draft"), "sidebar marks the unsaved view");
  entry.value = "docs.example";
  entry.closest("form").dispatchEvent(new Event("submit", {cancelable:true}));
  check(s.querySelectorAll("#siteSettings .site-list button").length === 2, "duplicate site is not added twice");
  entry.value = "bad domain";
  entry.closest("form").dispatchEvent(new Event("submit", {cancelable:true}));
  check(entry.getAttribute("aria-invalid") === "true", "quick add identifies an invalid address");
  const search = s.getElementById("customSearch");
  search.value = "docs"; search.dispatchEvent(new Event("input"));
  check(s.querySelectorAll("#siteSettings .site-list button").length === 1, "site search filters the list");
  search.value = "missing"; search.dispatchEvent(new Event("input"));
  check(s.querySelector("#siteSettings .site-list").textContent.includes("No matching"), "site search has an empty result state");
  search.value = ""; search.dispatchEvent(new Event("input"));
  s.getElementById("allowEntry").value = "reference.example";
  s.getElementById("allowEntry").closest("form").dispatchEvent(new Event("submit", {cancelable:true}));
  const beforeAtomic = w.writes;
  w.writeDelay = 200;
  s.getElementById("saveAll").click();
  check(entry.disabled && s.getElementById("discardAll").disabled, "editing is frozen during an asynchronous save");
  for (const fn of w.changeHandlers) fn({state:{newValue:structuredClone(w.fixture)}}, "local");
  check(entry.disabled, "storage notifications cannot unlock editing during a save");
  await pause(); await pause(); await pause();
  check(w.writes === beforeAtomic + 1 && w.fixture.allowlist[0] === "reference.example" && w.fixture.customBlocks.includes("docs.example"), "save all writes multiple sections in one atomic update");
  check(s.getElementById("saveBar").hidden && !entry.disabled, "successful save clears drafts and restores editing");
  w.writeDelay = 0;
  s.getElementById("custom").value += "\nbad domain";
  s.getElementById("custom").dispatchEvent(new Event("input"));
  const beforeInvalid = w.writes;
  s.getElementById("saveAll").click(); await pause();
  check(w.writes === beforeInvalid && s.querySelector("#siteSettings details").open, "invalid bulk draft prevents every save and reveals the error");
  s.querySelector("#siteSettings .site-list button").click();
  check(s.getElementById("custom").value.includes("bad domain"), "removing a site does not erase invalid bulk lines");
  s.getElementById("discardAll").click();
  entry.value = "new.example";
  entry.closest("form").dispatchEvent(new Event("submit", {cancelable:true}));
  w.rejectWrite = true;
  s.getElementById("saveAll").click(); await pause();
  check(!s.getElementById("saveBar").hidden && !entry.disabled && s.getElementById("saveMessage").classList.contains("error"), "failed save preserves drafts and allows retry");
  w.rejectWrite = false;
  s.getElementById("discardAll").click();
  const strictChoice = s.querySelector('[name="modeChoice"][value="strict"]');
  strictChoice.click();
  check(s.getElementById("blockingMode").value === "strict" && s.getElementById("modeDescription").textContent.startsWith("Strict"), "mode choice updates the draft and explanation");
  const beforeMode = w.writes;
  w.confirm = () => false;
  s.getElementById("saveAll").click();
  check(w.writes === beforeMode && !s.getElementById("saveBar").hidden, "canceling strict mode confirmation preserves the draft without writing");
  w.confirm = () => true;
  s.getElementById("saveAll").click(); await pause();
  check(w.fixture.mode === "strict" && s.getElementById("saveBar").hidden, "confirmed strict mode is saved through the shared bar");
  w.fixture.mode = "blocklist";
  w.fixture.lockUntil = Date.now() + 60000;
  for (const fn of w.changeHandlers) fn({state:{newValue:structuredClone(w.fixture)}}, "local");
  check(s.getElementById("allowEntry").disabled && !entry.disabled && s.querySelector("#siteSettings .site-list button").disabled, "lock prevents new allowances and saved block removals but permits new blocks");
  w.fixture.mode = "strict";
  for (const fn of w.changeHandlers) fn({state:{newValue:structuredClone(w.fixture)}}, "local");
  check(s.querySelector('[name="modeChoice"][value="strict"]').checked && s.querySelector('[name="modeChoice"][value="blocklist"]').disabled, "strict mode cannot be weakened during a lock");
  w.fixture.appPresent = true;
  w.fixture.customBlocks = ["app.example"];
  for (const fn of w.changeHandlers) fn({state:{newValue:w.fixture}}, "local");
  check(s.getElementById("custom").disabled && s.getElementById("custom").value === "app.example", "live native connection updates and locks app-owned controls");
  check(entry.disabled && s.querySelector("#rules .managed-notice").hidden === false && s.getElementById("saveBar").hidden, "app ownership is reflected by the site editor and save bar");
  const app = await frame(true), a = app.contentDocument;
  check(a.getElementById("blockingMode").disabled && a.getElementById("saveChecks").disabled, "managed controls read-only on load");
  const managedSyncCalls = app.contentWindow.syncCalls, managedWrites = app.contentWindow.writes;
  a.getElementById("repairProtection").click(); await pause();
  check(a.getElementById("custom").disabled && a.getElementById("custom").value === "example.com"
    && app.contentWindow.fixture.appPresent === true,
    "browser repair preserves app ownership and app-managed values");
  check(app.contentWindow.syncCalls === managedSyncCalls && app.contentWindow.writes === managedWrites,
    "managed browser repair is still independent of native checks and policy writes");
  a.getElementById("checkConnection").click(); await pause();
  check(a.getElementById("custom").disabled, "connection failure never grants local policy ownership");
  check(a.getElementById("connectionMessage").textContent.includes("remain app-managed"), "connection error explains retained app ownership");
  const aw = app.contentWindow;
  aw.fixture.lastHeartbeat = Date.now() - HEARTBEAT_GRACE_MS + 500;
  for (const fn of aw.changeHandlers) fn({state:{newValue:structuredClone(aw.fixture)}}, "local");
  check(a.getElementById("modeTitle").textContent === "Managed by the Hisn app", "fresh heartbeat updates the connection label");
  await new Promise(resolve => setTimeout(resolve, 1600));
  check(a.getElementById("modeTitle").textContent === "Waiting for the Hisn app", "connection label expires without a storage event");
  solo.style.width = "390px";
  await pause();
  check(s.documentElement.scrollWidth <= w.innerWidth, "narrow settings page has no horizontal overflow");
  // Arabic: the whole page mirrors, the words are Arabic, domains stay LTR,
  // and nothing overflows sideways on a phone-width window.
  const arFrame = await frame(false, "ar");
  const a2 = arFrame.contentDocument;
  check(a2.documentElement.dir === "rtl" && a2.documentElement.lang === "ar", "Arabic page is right-to-left");
  check(a2.getElementById("modeTitle").textContent === "حماية المتصفح فقط", "Arabic status text");
  check(a2.querySelector("h1").textContent === "طبقات الحماية" && a2.querySelector('#settings h1').textContent === 'خيارات المحتوى', "Arabic static text");
  a2.querySelector('a[href="#rules"]').click(); await pause();
  check(!a2.getElementById("rules").hidden, "Arabic navigation opens the rules view");
  check(a2.getElementById("custom").dir === "ltr", "domain fields stay left-to-right");
  check(a2.getElementById("uiLanguage").value === "ar", "the language picker shows the choice");
  arFrame.style.width = "390px";
  await pause();
  check(a2.documentElement.scrollWidth <= arFrame.contentWindow.innerWidth, "narrow Arabic page has no horizontal overflow");
  const visualFrame = await frame(false), v = visualFrame.contentDocument, vw = visualFrame.contentWindow;
  v.querySelector('a[href="#media"]').click(); await pause();
  check(!v.getElementById("media").hidden && v.getElementById("settings").hidden,
    "visual choices have a dedicated uncluttered page");
  check(v.querySelector('[name="personChoice"][value="off"]').checked && v.querySelectorAll('[name="personChoice"]').length === 4,
    "all four appearance choices are discoverable and the confirmed default is off");
  check(!v.getElementById("saveVisual"), "autosaved visual preferences have no dead save button");
  v.getElementById("inspectVisual").checked = true;
  v.getElementById("inspectVisual").dispatchEvent(new Event("change")); await pause();
  check(vw.fixture.inspectVisual === true && v.getElementById("inspectVisual").checked,
    "visual toggle saves through worker and retains its confirmed value");
  check(v.getElementById("msgVisual").textContent.length > 0 && !v.getElementById("msgVisual").classList.contains("error"),
    "visual autosave has success feedback");
  vw.rejectWrite = true;
  v.getElementById("personBlur").value = "all";
  v.getElementById("personBlur").dispatchEvent(new Event("change")); await pause();
  check(v.getElementById("personBlur").value === "off" && v.getElementById("msgVisual").classList.contains("error"),
    "failed visual save restores confirmed preference and keeps its error after status refresh");
  check(v.querySelector('[name="personChoice"][value="off"]').checked,
    "failed visual save restores the visible radio choice too");
  vw.rejectWrite = false;
  v.getElementById("personBlur").value = "all";
  v.getElementById("personBlur").dispatchEvent(new Event("change")); await pause();
  check(vw.fixture.personBlur === "all" && !v.getElementById("msgVisual").classList.contains("error"),
    "visual preference retry clears the old save error");
  v.querySelector('[name="personChoice"][value="female"]').click(); await pause();
  check(vw.fixture.personBlur === "female" && v.getElementById("personBlur").value === "female",
    "appearance card uses the existing guarded worker save path");
  vw.fixture.lockUntil = Date.now() + 60000;
  for (const fn of vw.changeHandlers) fn({state:{newValue:structuredClone(vw.fixture)}}, "local");
  check(v.querySelector('[name="personChoice"][value="off"]').disabled && v.querySelector('[name="personChoice"][value="male"]').disabled && !v.querySelector('[name="personChoice"][value="all"]').disabled,
    "appearance cards retain the commitment guard and allow only strengthening");
  check(v.getElementById("inspectVisual").disabled && !v.getElementById("visualLockHint").hidden,
    "active adult-media commitment cannot be weakened from the new page");
  a2.querySelector('a[href="#media"]').click(); await pause();
  check(!a2.getElementById("media").hidden && a2.querySelector('[name="personChoice"][value="female"]').closest("label").textContent.includes("النساء"),
    "Arabic visual navigation and appearance labels are translated");
  check(a2.documentElement.scrollWidth <= arFrame.contentWindow.innerWidth,
    "Arabic visual choices fit a narrow viewport");
  const target = a2.querySelector('[name="personChoice"][value="all"]').closest("label").getBoundingClientRect();
  check(target.height >= 44, "appearance choices retain comfortable touch targets");
  s.querySelector('.dashboard-shortcuts a[href="#media"]').click(); await pause();
  check(!s.getElementById("media").hidden, "dashboard opens visual preferences directly");
  document.getElementById("summary").dataset.result = "pass";
} catch (error) {
  results.push(`FAIL ${error.stack}`);
  document.getElementById("summary").dataset.result = "fail";
}
document.getElementById("summary").textContent = results.join("\n");
</script>
