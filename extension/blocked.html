<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked</title>
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --card: #ffffff;
    --line: #e3e3df;
    --accent: #2f6f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --fg: #f0efec; --muted: #9a9a94;
      --card: #201f1c; --line: #33322e; --accent: #7fb79a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .card {
    max-width: 460px; width: 100%;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 36px 32px; text-align: center;
  }
  .mark {
    width: 48px; height: 48px; margin: 0 auto 20px;
    border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 22px;
  }
  h1 { margin: 0 0 10px; font-size: 21px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 15px; color: var(--fg);
    padding: 12px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg);
  }
  .timer strong { font-weight: 600; }
  .note { margin: 18px 0 0; font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">&#10003;</div>
    <h1 id="title">This page is blocked</h1>
    <p id="subtitle">You set this up. It is working.</p>
    <div class="timer" id="timer" hidden></div>
    <p class="note" id="note"></p>
  </main>

<script src="blocked.js"></script>
</body>
</html>
