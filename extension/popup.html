<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hisn</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header><div class="brand"><img src="icons/icon-48.png" width="30" height="30" alt="">Hisn</div><button type="button" class="lang-switch" id="langSwitch" lang="ar">العربية</button></header>
  <p class="connection-badge" id="connectionBadge" data-i18n="popup.checking">Checking…</p>
  <section class="block" aria-live="polite">
    <div class="head"><span class="dot unknown" id="pDot" aria-hidden="true"></span><h2 id="pHead" data-i18n="popup.checkingStatus">Checking status…</h2></div>
    <p class="detail" id="pDetail"></p>
  </section>
  <section class="block" id="lockBlock"><div class="head"><span data-icon="lock" aria-hidden="true"></span><h2 id="lHead">&nbsp;</h2></div><p class="detail" id="lDetail"></p></section>
  <div id="notices"></div><div id="incognito" class="notice" hidden></div>
  <details><summary data-i18n="popup.details">Details</summary><dl id="details"></dl></details>
  <nav class="actions" data-i18n-aria-label="popup.shortcuts">
    <button type="button" id="openSettings"><span data-icon="settings" aria-hidden="true"></span><span data-i18n="popup.manage">Manage protection</span></button>
    <button type="button" class="secondary" id="checkConnection" data-i18n-title="popup.checkConnection" data-i18n-aria-label="popup.checkConnection"><span data-icon="refresh-cw" aria-hidden="true"></span></button>
  </nav>
  <p class="detail" id="connectionMessage" role="status"></p><p class="privacy-note" data-i18n="privacy.onDevice">Content checks stay on your device.</p>
  <script type="module" src="popup.js"></script>
</body></html>
