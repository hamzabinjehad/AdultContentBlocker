name: Build and publish blocklist

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      # Re-cut the bundled seed from this run's build and commit it to the
      # branch the workflow was dispatched on. This is how a term edit gets a
      # signed seed without the private key ever leaving CI: edit
      # blocklist/terms/, dispatch this on your branch with the box ticked,
      # and pull. See blocklist/seed.py for what the seed is and why it must
      # be re-signed at all.
      refresh_seed:
        description: "Re-cut and commit the signed seed bundle from this build"
        type: boolean
        default: false
  push:
    # main only: a push to any other branch used to rebuild AND publish, so an
    # unreviewed term edit on a feature branch went straight to every client.
    branches: [main]
    paths:
      - "blocklist/**"
      - ".github/workflows/update-blocklist.yml"

permissions:
  contents: write

concurrency:
  group: blocklist-publish
  cancel-in-progress: false

jobs:
  # The whole suite — Python, seed gate, extension, macOS — before a single
  # byte is published. The list build is a supply-chain step for every client,
  # and a broken repository should not be able to ship one.
  test:
    uses: ./.github/workflows/ci.yml
    with:
      skip_seed_gate: ${{ inputs.refresh_seed == true }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet 'cryptography>=42'

      # Pull the previously published manifest so the version counter keeps
      # increasing. Clients reject any manifest older than the one they hold,
      # so a reset-to-1 would brick every installed copy until the counter
      # climbed back past it.
      #
      # When nothing has been published yet, the counter starts from the SEED
      # manifest, not from 1: a fresh install holds the seed's version, and a
      # first publish numbered below it would be rejected by every client as a
      # rollback until the daily builds climbed past it.
      - name: Fetch previous manifest
        run: |
          mkdir -p dist
          if curl -fsSL -o dist/manifest.json \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/lists/manifest.json"; then
            echo "previous published version: $(python3 -c "import json;print(json.load(open('dist/manifest.json'))['version'])")"
          else
            cp seed/manifest.json dist/manifest.json
            echo "no published list yet; continuing from seed version $(python3 -c "import json;print(json.load(open('dist/manifest.json'))['version'])")"
          fi

      - name: Write signing key
        env:
          SIGNING_KEY: ${{ secrets.BLOCKLIST_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::BLOCKLIST_SIGNING_KEY secret is not set."
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$SIGNING_KEY" > keys/blocklist_ed25519.pem
          chmod 600 keys/blocklist_ed25519.pem

      - name: Build
        run: |
          python3 blocklist/build.py \
            --sources blocklist/sources.json \
            --out dist \
            --sign-key keys/blocklist_ed25519.pem

      - name: Verify what we are about to publish
        run: |
          python3 blocklist/keys.py verify \
            --dist dist \
            --pub blocklist/public_key.hex

      # A build that collapses to a fraction of its usual size almost always
      # means an upstream source changed format or started returning an error
      # page that happened to parse. Publishing it would quietly unblock most
      # of the internet, which is the single worst failure mode this system has.
      - name: Sanity floor
        run: |
          COUNT=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['domain_count'])")
          echo "domain_count=$COUNT"
          if [ "$COUNT" -lt 200000 ]; then
            echo "::error::Only $COUNT domains — refusing to publish a degraded list."
            exit 1
          fi

          # The keyword layer gets the same treatment, for the same reason. It
          # is the only thing covering domains registered since the last list
          # build, so a silently emptied term list reopens exactly the gap it
          # exists to close — and, like an empty blocklist, looks healthy from
          # every other angle.
          TERMS=$(python3 -c "import json;print(json.load(open('dist/manifest.json')).get('term_count',0))")
          HOSTTERMS=$(python3 -c "import json;print(json.load(open('dist/manifest.json')).get('host_term_count',0))")
          AR=$(python3 -c "import json;print(json.load(open('dist/manifest.json')).get('term_langs',{}).get('ar',0))")
          ARLATN=$(python3 -c "import json;print(json.load(open('dist/manifest.json')).get('term_langs',{}).get('ar-latn',0))")
          echo "term_count=$TERMS host_term_count=$HOSTTERMS ar=$AR ar-latn=$ARLATN"
          if [ "$TERMS" -lt 200 ] || [ "$HOSTTERMS" -lt 50 ]; then
            echo "::error::Only $TERMS terms / $HOSTTERMS host terms — refusing to publish a degraded keyword layer."
            exit 1
          fi
          # Arabic is a requirement of this product, not a nice-to-have, and the
          # romanised tier specifically is what makes hostname matching work at
          # all for Arabic-audience domains. Either dropping to zero is a build
          # bug, never an intentional change.
          if [ "$AR" -lt 1 ] || [ "$ARLATN" -lt 1 ]; then
            echo "::error::Arabic coverage collapsed (ar=$AR, ar-latn=$ARLATN) — refusing to publish."
            exit 1
          fi

      - name: Remove signing key
        if: always()
        run: rm -f keys/blocklist_ed25519.pem

      # --- refresh_seed -------------------------------------------------
      # Cut the seed from the build we are about to publish, so the bundled
      # list and the published list are the same signed manifest. Then run
      # the gate that was deferred in `test` against the result, and only
      # then commit. The push uses GITHUB_TOKEN, which does not start another
      # workflow run; the next push or pull request on the branch will.
      - name: Re-cut the seed bundle
        if: ${{ inputs.refresh_seed == true }}
        run: |
          python3 blocklist/seed.py sync --dist dist
          ./test.sh seed python
      - name: Commit the seed bundle
        if: ${{ inputs.refresh_seed == true }}
        run: |
          git config user.name  "hisn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seed extension/seed extension/rules
          if git diff --cached --quiet; then
            echo "seed already matches this build; nothing to commit"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('seed/manifest.json'))['version'])")
            git commit -m "Re-cut the signed seed bundle from blocklist v${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Published to an orphan `lists` branch so the artifacts never bloat the
      # main branch history — a ~19MB file changing daily would be brutal.
      # Whatever triggered the run, only main publishes. A dispatch on a
      # feature branch (refresh_seed) re-cuts that branch's seed and stops here.
      - name: Publish to lists branch
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name  "hisn-bot"
          git config user.email "bot@users.noreply.github.com"
          VERSION=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['version'])")
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp dist/* /tmp/publish/
          git checkout --orphan lists-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp /tmp/publish/* .
          git add -A
          git commit -m "blocklist v${VERSION}"
          git push --force origin lists-tmp:lists
